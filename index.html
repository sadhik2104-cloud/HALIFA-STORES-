<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--leaf:#5b2bd1;--leaf2:#3b1a94;--tur:#ffb020;--kum:#e11d6a;--ink:#1f1b3a;--line:#e0d6f5;--blue:#0b7ad1;--mut:#5f5a78;--fh:'Baloo Thambi 2','Noto Sans Tamil','Noto Sans Devanagari',Arial,sans-serif}
body,input,select,textarea,button{font-family:'Noto Sans Tamil','Noto Sans Devanagari',Arial,sans-serif}
h1,h2,h3,.phone,button,.lbl-btn,a.btn,.btn-submit,.nav b,.dh{font-family:var(--fh)}
body{color:var(--ink);line-height:1.5;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom));
background:radial-gradient(circle at 10% 0,rgba(255,122,89,.28),transparent 42%),radial-gradient(circle at 100% 25%,rgba(192,38,211,.20),transparent 45%),radial-gradient(circle at 0 100%,rgba(11,122,209,.16),transparent 45%),linear-gradient(180deg,#f1e8ff,#fff4ec 50%,#eaf3ff) fixed}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle,rgba(91,43,209,.09) 1.5px,transparent 2px) 0 0/24px 24px}
header{background:linear-gradient(135deg,var(--leaf),var(--leaf2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--tur);position:sticky;top:0;z-index:20}
.hwrap{display:flex;align-items:center;gap:12px}
header h1{font-size:24px;color:var(--tur);line-height:1}
header small{font-size:12px;color:#efe6ff;display:block}
.burger{background:rgba(255,255,255,.15);border:2px solid var(--tur);border-radius:10px;width:44px;height:44px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer;padding:0;flex:none}
.burger i{display:block;width:22px;height:3px;background:var(--tur);border-radius:2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;background:#fff;z-index:60;transform:translateX(-105%);transition:transform .25s;overflow-y:auto;box-shadow:6px 0 24px rgba(0,0,0,.3)}
.drawer.on{transform:none}
.dh{background:linear-gradient(135deg,var(--leaf),var(--leaf2));color:var(--tur);padding:calc(18px + env(safe-area-inset-top)) 16px 16px;border-bottom:4px solid var(--tur);display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:700}
.dh button{background:none;border:none;color:#fff;font-size:28px;cursor:pointer;line-height:1}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:none;border-bottom:1px solid var(--line);border-left:6px solid transparent;padding:15px 16px;font-size:17px;color:var(--ink);cursor:pointer;font-weight:600}
.mi.on{background:#efe8ff;color:var(--leaf);border-left-color:var(--tur)}
.mi span{font-size:22px}
@media(prefers-reduced-motion:reduce){.drawer,.ov,.view{transition:none;animation:none}}
.container{max-width:760px;margin:0 auto;padding:16px}
.view{display:none;animation:in .25s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.hero{background:linear-gradient(135deg,#5b2bd1,#c026d3 62%,#ff7a59);color:#fff;border-radius:18px;padding:26px 18px;text-align:center;box-shadow:0 10px 28px rgba(91,43,209,.3);margin-bottom:16px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,176,32,.25)}
.hero h2{font-size:30px;color:var(--tur);position:relative}
.hero p{position:relative;color:#efe6ff;font-size:14px;margin-top:4px}
.hero .slogan{color:#fff;font-weight:700;font-size:16px}
.phone{margin-top:12px;font-size:20px;font-weight:700;position:relative}
.install-btn{margin-top:12px;background:#fff;color:var(--leaf);border:none;border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;position:relative}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
a.btn{text-decoration:none;color:#fff;padding:12px 8px;border-radius:12px;font-weight:700;text-align:center;font-size:15px;display:block;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.call-btn{background:var(--kum)}.wa-btn{background:#1c9c52}.map-open{background:var(--blue)}.map-dir{background:var(--leaf)}
.card{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(91,43,209,.08);margin-bottom:16px}
.ttl{color:var(--leaf);font-size:24px;margin-bottom:12px}
.services{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.service-card{background:#fff;padding:14px;border:1px solid var(--line);border-left:6px solid var(--tur);border-radius:12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.05);transition:transform .15s}
.service-card:active{transform:scale(.97)}
.service-card h3{color:var(--leaf);font-size:16px}
.bcard{background:#fff;border:1px solid var(--line);border-left:6px solid var(--tur);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.bcard h3{color:var(--leaf);font-size:17px;margin-bottom:6px}
.bchip{display:inline-block;background:#efe8ff;color:var(--leaf2);border-radius:14px;padding:3px 10px;font-size:13px;margin:2px 3px 2px 0;font-weight:600}
.form-group{margin-bottom:12px}
.form-group label{display:block;margin-bottom:5px;font-weight:600}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;font-size:15px;background:#fcfbff;color:var(--ink)}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:3px solid rgba(255,176,32,.55);border-color:var(--leaf)}
.hidden{display:none!important}
.photo-box,.loc-box{border:2px dashed var(--blue);border-radius:12px;padding:8px;text-align:center;background:#f3f8ff}
.photo-actions{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.photo-actions button,.loc-box button,.lbl-btn{border:none;border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:700;color:#fff;background:var(--blue);display:inline-block}
.loc-box button{margin:0 4px 4px}
.btn-outline{background:#fff!important;color:var(--blue)!important;border:2px solid var(--blue)!important}
.sr-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.hint{font-size:13px;color:var(--mut);margin-top:8px}.hint a{color:var(--blue);font-weight:700}
.previews{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;justify-content:center}
.thumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;border:3px solid #ddd;cursor:pointer}
.thumb.selected{border-color:var(--blue)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .tick{position:absolute;top:3px;right:3px;background:var(--blue);color:#fff;border-radius:50%;width:22px;height:22px;font-size:14px;line-height:22px;text-align:center}
.thumb:not(.selected) .tick{background:#999}.thumb:not(.selected) img{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.form-group .chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer;background:#fff;font-weight:400;margin:0}
.form-group .chip input{width:auto;padding:0;border:none}
.form-group .chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn-submit{background:linear-gradient(180deg,#ffc933,var(--tur));color:var(--ink);border:none;padding:14px;width:100%;font-size:20px;font-weight:700;border-radius:12px;cursor:pointer;box-shadow:0 4px 12px rgba(255,176,32,.4)}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pm button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-weight:700;cursor:pointer;color:var(--ink);font-size:14px}
.pm button.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.qrbox{text-align:center}
#qr{display:inline-block;background:#fff;padding:12px;border-radius:14px;border:3px solid var(--tur);margin:8px 0}
#qr img,#qr canvas{display:block}
.upi-id{font-weight:700;color:var(--leaf);font-size:18px;word-break:break-all}
.apps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.apps button{border:none;color:#fff;border-radius:12px;padding:12px;font-weight:700;cursor:pointer;font-size:15px}
.shop-addr{background:#fff;border-left:6px solid var(--tur);border-radius:12px;padding:14px;margin-bottom:12px}
.shop iframe{width:100%;height:300px;border:2px solid var(--line);border-radius:14px}
footer{text-align:center;padding:18px;color:var(--mut);font-size:13px}
footer strong{color:var(--leaf)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(91,43,209,.12)}
.nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;padding:4px 0;color:var(--mut);cursor:pointer;position:relative}
.nav span{font-size:21px;line-height:1.2}.nav b{font-size:11px;font-weight:600;white-space:nowrap}
.nav button.on{color:var(--leaf)}
.nav button.on:before{content:"";position:absolute;top:-7px;width:32px;height:4px;border-radius:0 0 4px 4px;background:var(--tur)}
.nav button.on span{transform:translateY(-2px) scale(1.12)}
.lang{position:relative}
#langBtn{background:rgba(255,255,255,.15);color:#fff;border:2px solid var(--tur);border-radius:10px;padding:6px 12px;font-weight:700;cursor:pointer;font-size:15px}
.lang-menu{position:absolute;right:0;top:calc(100% + 8px);background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;min-width:160px}
.lang-menu button{display:block;width:100%;text-align:left;background:#fff;border:none;padding:12px 16px;font-size:16px;cursor:pointer;color:var(--ink)}
.lang-menu button.on{background:var(--leaf);color:#fff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{display:flex;gap:8px;margin-bottom:14px}
.steps span{flex:1;text-align:center;padding:8px;border-radius:10px;background:#efe8ff;color:var(--mut);font-weight:700;font-family:var(--fh)}
.steps span.on{background:var(--leaf);color:#fff}
.navbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.btn-back{background:#fff;border:2px solid var(--leaf);color:var(--leaf);border-radius:12px;font-size:18px;font-weight:700;padding:12px;cursor:pointer}
</style>
</head>

var lang="en",files=[],probSel={},loc=null,payM="upi";
function tr(k){return T[lang][k]}
function $(i){return document.getElementById(i)}

function step(n){
  $("s1").classList.toggle("hidden",n!==1);$("s2").classList.toggle("hidden",n!==2);
  $("st1").classList.toggle("on",n===1);$("st2").classList.toggle("on",n===2);
  window.scrollTo({top:0});
}
function nextStep(){if(!$("name").reportValidity()||!$("phone").reportValidity())return;step(2)}
function go(id){
  if(id==="book"&&!$("v-book").classList.contains("on"))step(1);
  document.querySelectorAll(".view").forEach(function(v){v.classList.toggle("on",v.id==="v-"+id)});
  document.querySelectorAll(".nav button,.mi").forEach(function(b){b.classList.toggle("on",b.dataset.go===id)});
  window.scrollTo({top:0});
  if(id==="pay")drawQR();
  try{history.replaceState(null,"","#"+id)}catch(e){}
}
$("nav").addEventListener("click",function(e){var b=e.target.closest("button");if(b)go(b.dataset.go)});

/* side menu */
function menu(o){$("ov").classList.toggle("on",o);$("drawer").classList.toggle("on",o)}
$("burger").onclick=function(){menu(true)};
$("ov").onclick=$("dClose").onclick=function(){menu(false)};
document.addEventListener("keydown",function(e){if(e.key==="Escape")menu(false)});
$("drawer").addEventListener("click",function(e){var b=e.target.closest(".mi");if(b){go(b.dataset.go);menu(false)}});

/* language */
function toggleLang(){$("langMenu").classList.toggle("hidden")}
function setLang(l){
  lang=l;document.documentElement.lang=l;
  document.querySelectorAll("#langMenu button").forEach(function(b){b.classList.toggle("on",b.dataset.l===l)});
  $("langMenu").classList.add("hidden");render();
}
$("langMenu").addEventListener("click",function(e){var b=e.target.closest("button");if(b)setLang(b.dataset.l)});
document.addEventListener("click",function(e){if(!e.target.closest(".lang"))$("langMenu").classList.add("hidden")});

function render(){
  document.querySelectorAll("[data-i18n]").forEach(function(e){e.textContent=tr(e.dataset.i18n)});
  document.querySelectorAll("[data-ph]").forEach(function(e){e.placeholder=tr(e.dataset.ph)});
  $("services").innerHTML=SERVICES.map(function(x,i){return '<div class="service-card" onclick="pick('+i+')"><h3>'+x.i+' '+x[lang]+'</h3></div>'}).join("");
  $("brandList").innerHTML=APPLIANCES.filter(function(a){return a.brands.length}).map(function(a){
    return '<div class="bcard" onclick="pickApp(\''+a.id+'\')"><h3>'+a.ic+' '+a[lang]+'</h3>'+a.brands.map(function(b){return '<span class="bchip">'+b+'</span>'}).join("")+'</div>';
  }).join("");
  $("hotelList").innerHTML=HOTEL.map(function(x,i){return '<div class="service-card" onclick="pickHotel('+i+')"><h3>'+x.i+' '+x[lang]+'</h3></div>'}).join("");
  var ct=$("custType");["home","hotel","shop"].forEach(function(v,i){ct.options[i].textContent=tr({home:"cHome",hotel:"cHotel",shop:"cShop"}[v])});
  var sel=$("appliance"),cur=sel.value||"gas";
  sel.innerHTML=APPLIANCES.map(function(a){return '<option value="'+a.id+'">'+a[lang]+'</option>'}).join("");
  sel.value=cur;
  $("pm").innerHTML=[["upi","💳 "+tr("mUpi")],["cash","💵 "+tr("mCash")],["card","🏧 "+tr("mCard")]].map(function(m){
    return '<button type="button" data-m="'+m[0]+'" class="'+(payM===m[0]?"on":"")+'">'+m[1]+'</button>'}).join("");
  document.querySelectorAll(".cpy").forEach(function(b){b.textContent=tr("copy")});
  $("upiId").textContent=UPI_ID;
  renderBrands(true);renderProblems();showLoc();showPay(payM);
  document.querySelectorAll("[data-wa]").forEach(function(a){a.href="https://wa.me/"+a.dataset.wa+"?text="+encodeURIComponent(tr("waHello"))});
}
function pickApp(id){$("appliance").value=id;probSel={};renderBrands(false);renderProblems();go("book")}
function pickHotel(i){pickApp("other");$("otherAppliance").value=HOTEL[i][lang];$("custType").value="hotel"}
function pick(i){pickApp(SERVICES[i].k);$("custType").value=SERVICES[i].c||"home"}

/* payments (Pay tab only) */
function upiLink(){
  var a=parseFloat($("amt").value);
  return "upi://pay?pa="+encodeURIComponent(UPI_ID)+"&pn="+encodeURIComponent(UPI_NAME)+"&cu=INR"+(a>0?"&am="+a.toFixed(2):"");
}
function drawQR(){
  var box=$("qr");box.innerHTML="";
  if(typeof QRCode==="undefined"){box.textContent=UPI_ID;return}
  new QRCode(box,{text:upiLink(),width:200,height:200,colorDark:"#3b1a94",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
}
function showPay(m){
  payM=m;
  $("pUpi").classList.toggle("hidden",m!=="upi");
  $("pCash").classList.toggle("hidden",m!=="cash");
  $("pCard").classList.toggle("hidden",m!=="card");
  document.querySelectorAll("#pm button").forEach(function(b){b.classList.toggle("on",b.dataset.m===m)});
  if(m==="upi")drawQR();
}
$("pm").addEventListener("click",function(e){var b=e.target.closest("button");if(b)showPay(b.dataset.m)});
$("amt").addEventListener("input",drawQR);
function openUpi(){location.href=upiLink()}
function copyUpi(btn){
  function done(){btn.textContent=tr("copied");setTimeout(function(){btn.textContent=tr("copy")},1800)}
  if(navigator.clipboard)navigator.clipboard.writeText(UPI_ID).then(done,function(){});
  else{var t=document.createElement("textarea");t.value=UPI_ID;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();done()}
}

/* booking form */
function currentAppliance(){var id=$("appliance").value;return APPLIANCES.find(function(a){return a.id===id})}
function renderBrands(keep){
  var a=currentAppliance(),bs=$("brand"),prev=keep?bs.value:"";
  $("otherApplianceBox").classList.toggle("hidden",a.id!=="other");
  var o='<option value="">'+tr("brandSel")+'</option>';
  a.brands.forEach(function(b){o+='<option value="'+b+'">'+b+'</option>'});
  o+='<option value="__other">'+tr("brandOther")+'</option><option value="__unknown">'+tr("brandUnknown")+'</option>';
  bs.innerHTML=o;if(prev)bs.value=prev;
  $("otherBrandBox").classList.toggle("hidden",bs.value!=="__other");
}
$("appliance").addEventListener("change",function(){probSel={};renderBrands(false);renderProblems()});
function pTxt(id,i){return PROBS[id][i][LI[lang]]}
function renderProblems(){
  var id=$("appliance").value,list=PROBS[id]||[];
  $("probBox").classList.toggle("hidden",!list.length);
  $("probChips").innerHTML=list.map(function(p,i){
    var on=probSel[i];
    return '<label class="chip'+(on?' on':'')+'"><input type="checkbox" data-i="'+i+'"'+(on?' checked':'')+'>'+pTxt(id,i)+'</label>';
  }).join("");
}
$("probChips").addEventListener("change",function(e){
  probSel[e.target.dataset.i]=e.target.checked;
  e.target.parentNode.classList.toggle("on",e.target.checked);
});
$("brand").addEventListener("change",function(){$("otherBrandBox").classList.toggle("hidden",this.value!=="__other")});
$("photos").addEventListener("change",function(){
  Array.prototype.forEach.call(this.files,function(f){files.push({file:f,url:URL.createObjectURL(f),selected:true})});
  this.value="";drawPreviews();
});
function drawPreviews(){
  var box=$("previews");box.innerHTML="";
  files.forEach(function(p){
    var d=document.createElement("div");
    d.className="thumb"+(p.selected?" selected":"");
    d.innerHTML='<img src="'+p.url+'" alt=""><span class="tick">'+(p.selected?"✓":"")+'</span>';
    d.onclick=function(){p.selected=!p.selected;drawPreviews()};
    box.appendChild(d);
  });
}
function mapUrl(){return "https://www.google.com/maps?q="+loc.lat+","+loc.lng}
function showLoc(err){
  var st=$("locStatus");
  $("locClear").classList.toggle("hidden",!loc);
  if(loc)st.innerHTML="✅ "+tr("locOk")+' <a href="'+mapUrl()+'" target="_blank">'+tr("locView")+'</a>';
  else st.textContent=err?tr("locErr"):tr("locHint");
}
function getLoc(){
  var st=$("locStatus");
  if(!navigator.geolocation){st.textContent=tr("locNo");return}
  st.textContent=tr("locWait");
  navigator.geolocation.getCurrentPosition(function(pos){
    loc={lat:pos.coords.latitude.toFixed(6),lng:pos.coords.longitude.toFixed(6)};showLoc();
  },function(){loc=null;showLoc(true)},{enableHighAccuracy:true,timeout:15000});
}
function clearLoc(){loc=null;showLoc()}

$("bookForm").addEventListener("submit",function(e){
  e.preventDefault();
  var a=currentAppliance();
  var item=a.id==="other"?($("otherAppliance").value.trim()||a[lang]):a[lang];
  var b=$("brand").value,brand="";
  if(b==="__other")brand=$("otherBrand").value.trim();
  else if(b==="__unknown")brand=tr("brandUnknown");
  else brand=b;
  var sel=files.filter(function(p){return p.selected}).map(function(p){return p.file});
  var lines=[tr("waHello"),"",tr("wName")+": "+$("name").value.trim(),tr("wPhone")+": "+$("phone").value.trim(),tr("wItem")+": "+item,tr("wCust")+": "+$("custType").options[$("custType").selectedIndex].textContent];
  if(brand)lines.push(tr("wBrand")+": "+brand);
  var pl=[];(PROBS[a.id]||[]).forEach(function(p,i){if(probSel[i])pl.push(pTxt(a.id,i))});
  var pt=$("problemText").value.trim();
  if(pt)pl.push(pt);
  if(pl.length)lines.push(tr("wProblem")+": "+pl.join(", "));
  var ad=$("address").value.trim();
  if(ad)lines.push(tr("wAddr")+": "+ad);
  if(loc)lines.push(tr("wLoc")+": "+mapUrl());
  if(sel.length)lines.push(tr("wPhotos")+": "+sel.length+" - "+tr("wPhotosNote"));
  var text=lines.join("\n");
  var waUrl="https://wa.me/"+$("sendTo").value+"?text="+encodeURIComponent(text);
  if(sel.length&&navigator.canShare&&navigator.canShare({files:sel})){
    navigator.share({files:sel,text:text}).catch(function(err){if(err&&err.name!=="AbortError")window.open(waUrl,"_blank")});
  }else{
    if(sel.length)alert(tr("noShare"));
    window.open(waUrl,"_blank");
  }
});

/* install */
var deferredPrompt=null,installBtn=$("installBtn");
if(window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone)installBtn.classList.add("hidden");
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e});
window.addEventListener("appinstalled",function(){installBtn.classList.add("hidden")});
installBtn.addEventListener("click",function(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else alert(tr("installHelp"))});
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}

render();
var h=location.hash.replace("#","");
if(["home","services","hotel","book","brands","pay","shop"].indexOf(h)>-1)go(h);
</script>

<!-- App icon + manifest (drawn by the browser, no image files needed) -->
<script>
(function(){
function draw(S){
  var c=document.createElement('canvas');c.width=c.height=S;
  var x=c.getContext('2d');x.scale(S/1024,S/1024);
  var g=x.createRadialGradient(512,512,0,512,512,720);
  g.addColorStop(0,'#0e3a6b');g.addColorStop(1,'#06142a');
  x.fillStyle=g;x.fillRect(0,0,1024,1024);
  x.fillStyle='#06b6d4';x.beginPath();
  var n=16,Ro=335,Ri=300,first=true;
  for(var i=0;i<n;i++){
    var b=2*Math.PI*i/n,w=Math.PI/n;
    [[-0.5,Ri],[-0.3,Ro],[0.3,Ro],[0.5,Ri]].forEach(function(p){
      var px=512+p[1]*Math.cos(b+p[0]*w),py=512+p[1]*Math.sin(b+p[0]*w);
      if(first){x.moveTo(px,py);first=false}else x.lineTo(px,py);
    });
  }
  x.closePath();x.fill();
  function dot(cx,cy,r,col){x.fillStyle=col;x.beginPath();x.arc(cx,cy,r,0,7);x.fill()}
  function ln(x1,y1,x2,y2,w,col){x.strokeStyle=col;x.lineWidth=w;x.lineCap='butt';x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()}
  dot(512,512,300,'#06b6d4');dot(512,512,268,'#ffffff');
  ln(417,310,607,500,38,'#ff6b1a');
  dot(417,310,46,'#ff6b1a');dot(391,284,21,'#ffffff');dot(607,500,32,'#ff6b1a');
  ln(607,310,417,500,20,'#647087');
  ln(417,500,472,445,44,'#ff6b1a');
  dot(607,310,14,'#647087');
  x.fillStyle='#0b1f3a';x.font='bold 215px Arial, Helvetica, sans-serif';
  x.textAlign='center';x.textBaseline='middle';x.fillText('HS',512,630);
  return c.toDataURL('image/png');
}
var i192=draw(192),i512=draw(512);
function link(rel,href){var l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l);return l}
link('icon',i192);link('apple-touch-icon',i192);
var base=location.origin+location.pathname.replace(/[^\/]*$/,'');
var m={name:'HALIFA STORES',short_name:'HALIFA',start_url:base,scope:base,display:'standalone',
 background_color:'#0b1f3a',theme_color:'#0b1f3a',
 icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},
        {src:i512,sizes:'512x512',type:'image/png',purpose:'any'},
        {src:i512,sizes:'512x512',type:'image/png',purpose:'maskable'}]};
link('manifest',URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})));
})();
</script>
